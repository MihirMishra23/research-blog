<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The LLM Map</title>
  <desc id="desc">A connected knowledge graph representing a public research notebook about modern language models.</desc>
  <defs>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#4b4b43" />
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#181916" />
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.72" />
  <g fill="none" stroke="#eee9dc" stroke-width="5">
    <path d="M810 315 968 180M810 315 1006 430M810 315 590 162M810 315 568 462" />
  </g>
  <g fill="#181916" stroke="#eee9dc" stroke-width="5">
    <ellipse cx="810" cy="315" rx="118" ry="70" />
    <ellipse cx="978" cy="170" rx="87" ry="51" />
    <ellipse cx="1016" cy="440" rx="96" ry="55" />
    <ellipse cx="568" cy="152" rx="92" ry="54" />
    <ellipse cx="548" cy="472" rx="104" ry="58" />
  </g>
  <g fill="#f19a78">
    <circle cx="719" cy="280" r="7" />
    <circle cx="703" cy="302" r="5" />
    <circle cx="703" cy="328" r="4" />
  </g>
  <text x="88" y="105" fill="#f19a78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="4">RESEARCH NOTEBOOK / 01</text>
  <text x="84" y="254" fill="#eee9dc" font-family="Iowan Old Style, Baskerville, Georgia, serif" font-size="96" letter-spacing="-4">The LLM Map</text>
  <text x="90" y="330" fill="#b8b1a2" font-family="Charter, Georgia, serif" font-size="31">How modern language models are trained,</text>
  <text x="90" y="374" fill="#b8b1a2" font-family="Charter, Georgia, serif" font-size="31">adapted, evaluated, and served.</text>
  <text x="810" y="325" fill="#eee9dc" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="32">LLMs</text>
</svg>
